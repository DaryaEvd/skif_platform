version: '3.8'

services:
  model2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model2
    volumes:
      - ./data:/data
    environment:
      - INPUT_FILE=/data/start2.json
      - OUTPUT_FILE=/data/end2.json
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"