spring.application.name=supervisor
# Run from supervisor/, or set SUPERVISOR_PROJECT_ROOT to its absolute path.
supervisor.paths.project-root=${SUPERVISOR_PROJECT_ROOT:${user.dir}}
supervisor.paths.experiments-root=${SUPERVISOR_EXPERIMENTS_ROOT:${supervisor.paths.project-root}/experiment-data}
supervisor.paths.models-root-dir-path=${supervisor.paths.project-root}/models
# Legacy path settings are retained for compatibility; model transport now uses HTTP.
supervisor.paths.start-json-dir-path=${supervisor.paths.project-root}/start_json_files
supervisor.paths.end-json-dir-path=${supervisor.paths.project-root}/end_json_files
supervisor.paths.inter-model-json-dir-path=${supervisor.paths.project-root}/inter_model_json_files
supervisor.runtime.readiness-seconds=60
supervisor.runtime.expected-seconds=600
supervisor.runtime.poll-millis=200
